<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Trần Dương Gia Bảo - Software Engineering &amp; Applied AI">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#08111e"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#58A6FF"/>
      <stop offset="85%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cardGlow" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cardGlow2" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#58A6FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#08111e" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', Consolas, 'SF Mono', Menlo, Monaco, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif; }
      
      .name { font: 800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; fill: #FFFFFF; letter-spacing: -0.5px; }
      .role-lead { font: 700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif; fill: #E0F2FE; }
      .tagline { font: 400 13.5px 'JetBrains Mono', Consolas, monospace; fill: #94A3B8; }
      .badge-text { font: 600 11px 'JetBrains Mono', Consolas, monospace; fill: #38BDF8; letter-spacing: 1.2px; }
      .chip-text { font: 600 11.5px 'JetBrains Mono', Consolas, monospace; fill: #CBD5E1; }
      
      .status-text { font: 600 11.5px 'JetBrains Mono', Consolas, monospace; fill: #34D399; }
      .meta-text { font: 500 11.5px 'JetBrains Mono', Consolas, monospace; fill: #64748B; }

      .pulse { animation: pulseAnim 2.8s ease-in-out infinite; }
      .pulse2 { animation: pulseAnim 2.8s ease-in-out infinite; animation-delay: 0.9s; }
      .pulse3 { animation: pulseAnim 2.8s ease-in-out infinite; animation-delay: 1.8s; }
      .dash-flow { stroke-dasharray: 6 8; animation: flowAnim 4s linear infinite; }
      .cursor { animation: blinkAnim 1s step-end infinite; }
      .radar-line { animation: scanAnim 7s linear infinite; }

      @keyframes pulseAnim {
        0%, 100% { opacity: 0.3; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes flowAnim {
        to { stroke-dashoffset: -28; }
      }
      @keyframes blinkAnim {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      @keyframes scanAnim {
        0% { transform: translateX(-150px); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translateX(1250px); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse2, .pulse3, .dash-flow, .cursor, .radar-line { animation: none; }
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#cardGlow)"/>
  <rect width="1200" height="340" rx="20" fill="url(#cardGlow2)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>

  <!-- Outer Border with subtle gradient -->
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Radar Scan Sweep -->
  <g class="radar-line">
    <rect x="-100" y="2" width="100" height="336" fill="url(#accent)" opacity="0.04"/>
    <line x1="0" y1="2" x2="0" y2="338" stroke="#38BDF8" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Top Bar / Terminal Header -->
  <g transform="translate(48, 38)">
    <!-- Terminal window dots -->
    <circle cx="0" cy="0" r="5" fill="#EF4444" opacity="0.85"/>
    <circle cx="18" cy="0" r="5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="36" cy="0" r="5" fill="#10B981" opacity="0.85"/>

    <!-- Breadcrumb -->
    <text x="60" y="4" class="meta-text">peo051://dev-workspace/portfolio-core</text>

    <!-- Top Right Meta -->
    <text x="1000" y="4" text-anchor="end" class="meta-text">v2026.09 • HUIT IT</text>
  </g>

  <!-- Decorative Top Line Divider -->
  <line x1="48" y1="58" x2="1152" y2="58" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Main Content Area -->
  <g transform="translate(48, 92)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="220" height="24" rx="6" fill="#0C253E" stroke="#1E4976" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
    <text x="24" y="15.5" class="badge-text">SOFTWARE ENGINEER</text>

    <!-- Full Name with gradient bar -->
    <g transform="translate(0, 52)">
      <rect x="0" y="-30" width="4.5" height="36" rx="2" fill="url(#accent)"/>
      <text x="18" y="0" class="name">TRẦN DƯƠNG GIA BẢO</text>
    </g>

    <!-- Role Sub-heading -->
    <text x="0" y="86" class="role-lead">Backend Architecture <tspan fill="#38BDF8">×</tspan> Applied AI &amp; Computer Vision</text>

    <!-- Tagline & Philosophy -->
    <text x="0" y="116" class="tagline">"Architecting resilient systems, optimizing algorithms, and engineering intelligence"<tspan class="cursor" fill="#38BDF8">_</tspan></text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 142)">
      <!-- Pill 1: .NET / C# -->
      <rect x="0" y="0" width="88" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#512BD4"/>
      <text x="24" y="17" class="chip-text">.NET 8</text>

      <!-- Pill 2: FastAPI -->
      <rect x="96" y="0" width="94" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="108" cy="13" r="3" fill="#009688"/>
      <text x="120" y="17" class="chip-text">FastAPI</text>

      <!-- Pill 3: Next.js -->
      <rect x="198" y="0" width="90" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="210" cy="13" r="3" fill="#F8FAFC"/>
      <text x="222" y="17" class="chip-text">Next.js</text>

      <!-- Pill 4: YOLOv8 / CV -->
      <rect x="296" y="0" width="96" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="308" cy="13" r="3" fill="#38BDF8"/>
      <text x="320" y="17" class="chip-text">YOLOv8</text>

      <!-- Pill 5: PyTorch -->
      <rect x="400" y="0" width="94" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="412" cy="13" r="3" fill="#EE4C2C"/>
      <text x="424" y="17" class="chip-text">PyTorch</text>

      <!-- Pill 6: Algorithmic Mining -->
      <rect x="502" y="0" width="138" height="26" rx="6" fill="#111C2D" stroke="#1E334E" stroke-width="1"/>
      <circle cx="514" cy="13" r="3" fill="#A78BFA"/>
      <text x="526" y="17" class="chip-text">HUI Mining (R&amp;D)</text>
    </g>
  </g>

  <!-- Right Visual Area: Interactive System Telemetry Card -->
  <g transform="translate(800, 78)">
    <!-- Inner Card Backdrop -->
    <rect width="352" height="202" rx="14" fill="#07111D" stroke="#1E2E44" stroke-width="1.2"/>

    <!-- Inner Card Header -->
    <text x="20" y="28" class="badge-text" fill="#64748B">ARCHITECTURE MATRIX</text>
    <rect x="250" y="16" width="82" height="18" rx="9" fill="#064E3B" stroke="#059669" stroke-width="0.8"/>
    <circle cx="260" cy="25" r="3" fill="#34D399"/>
    <text x="270" y="28.5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34D399">ACTIVE</text>

    <!-- Connecting Bus Lines -->
    <path d="M 64 92 L 140 92 M 164 92 L 244 92" stroke="#1E3A5F" stroke-width="2" fill="none"/>
    <path d="M 64 92 L 140 92 M 164 92 L 244 92" stroke="url(#accent)" stroke-width="2" fill="none" class="dash-flow"/>
    
    <path d="M 152 104 L 152 142" stroke="#1E3A5F" stroke-width="2" fill="none"/>
    <path d="M 152 104 L 152 142" stroke="#A78BFA" stroke-width="2" fill="none" class="dash-flow"/>

    <!-- Node 1: Backend (.NET / C#) -->
    <g transform="translate(52, 92)">
      <circle cx="0" cy="0" r="24" fill="#0E2238" stroke="#1E446E" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="#0284C7" opacity="0.3" class="pulse"/>
      <circle cx="0" cy="0" r="5" fill="#38BDF8"/>
      <text x="0" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">.NET</text>
      <text x="0" y="49" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Engine</text>
    </g>

    <!-- Node 2: Core Hub (AI & APIs) -->
    <g transform="translate(152, 92)">
      <circle cx="0" cy="0" r="27" fill="#132742" stroke="#2563EB" stroke-width="2"/>
      <circle cx="0" cy="0" r="17" fill="#38BDF8" opacity="0.35" class="pulse2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="6" fill="#60A5FA"/>
      <text x="0" y="41" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">AI/API</text>
      <text x="0" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Core</text>
    </g>

    <!-- Node 3: Algorithms (R&D) -->
    <g transform="translate(252, 92)">
      <circle cx="0" cy="0" r="24" fill="#1A1838" stroke="#4C1D95" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="14" fill="#818CF8" opacity="0.3" class="pulse3"/>
      <circle cx="0" cy="0" r="5" fill="#C084FC"/>
      <text x="0" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">R&amp;D</text>
      <text x="0" y="49" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">HUIM</text>
    </g>

    <!-- Node 4: Applications Layer -->
    <g transform="translate(152, 152)">
      <circle cx="0" cy="0" r="16" fill="#063529" stroke="#059669" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#34D399"/>
      <text x="24" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#6EE7B7">Web &amp; Desktop Apps</text>
    </g>
  </g>

  <!-- Bottom Meta Bar -->
  <line x1="48" y1="298" x2="1152" y2="298" stroke="#1E293B" stroke-width="1"/>
  
  <g transform="translate(48, 318)">
    <!-- Location & Status Indicator -->
    <circle cx="4" cy="-3" r="3.5" fill="#10B981" class="pulse"/>
    <text x="16" y="0" class="status-text">Available for Software &amp; AI Engineering Opportunities</text>

    <!-- Right Side Stats / Links -->
    <text x="1104" y="0" text-anchor="end" class="meta-text">HUIT • Ho Chi Minh City, Vietnam</text>
  </g>
</svg>
